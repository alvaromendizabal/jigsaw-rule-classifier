[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jigsaw-rule-classifier"
version = "0.2.0"
description = "Rule-conditioned NLP with explicit validation, resumable experiments, and portable Kaggle inference."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.5", "pandas==2.2.3", "scipy==1.17.0", "scikit-learn==1.8.0",
  "joblib==1.5.3", "filelock==3.32.5", "plotly==7.0.0",
  "boto3==1.43.89", "kaggle==2.2.4", "psutil==7.2.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.6",
    "nbformat==5.11.1",
    "nbclient==0.11.0",
    "ipykernel==7.3.0",
    "matplotlib==3.10.8",
]

[project.scripts]
jigsaw = "jigsaw_rules.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jigsaw_rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_notebooks.py" = ["E501"]
"src/jigsaw_rules/report.py" = ["E501"]

[project.optional-dependencies]
semantic = ["torch==2.10.0", "transformers==4.57.6", "huggingface-hub==0.36.2", "peft==0.18.0", "accelerate==1.12.0"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
