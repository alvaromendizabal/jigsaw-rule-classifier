name: Quality
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/notebook-owned-experiments'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_LINK_MODE: copy
      JIGSAW_CLOUD: '0'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - name: Check out the exact trusted development head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply the checksum-verified source transfer
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, subprocess
          encoded = '''
          
          
          
          
          
          
          '''
          data = base64.b64decode(''.join(encoded.split()), validate=True)
          if hashlib.sha256(data).hexdigest() != '4515b190b41b5d4fa34c1fd3f39a06fe73d8027ed84a6df6cc144a8c690db59c':
              raise SystemExit('Source transfer checksum mismatch')
          patch = lzma.decompress(data)
          expected = {'README.md','START_HERE.md','scripts/build_notebooks.py','scripts/execute_notebooks.py','src/jigsaw_rules/cli.py','src/jigsaw_rules/features.py','src/jigsaw_rules/submission.py','tests/test_feature_experiment.py','tests/test_publication.py','tests/test_submission_generation.py','tests/test_workspace_update.py'}
          stats = subprocess.run(['git','apply','--numstat','-'], input=patch, capture_output=True, check=True).stdout.decode()
          if {line.split('\t',2)[2] for line in stats.splitlines()} != expected:
              raise SystemExit('Unexpected source transfer path')
          subprocess.run(['git','apply','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','-'], input=patch, check=True)
          print('SOURCE_TRANSFER_VERIFIED', len(expected), len(patch))
          PY
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --extra semantic --group dev
      - run: uv run --extra semantic python scripts/build_notebooks.py
      - run: uv run --extra semantic python scripts/verify.py
      - name: Execute all five public notebooks in real kernels
        run: uv run --extra semantic python scripts/execute_notebooks.py --publish
      - name: Verify completed notebook reuse
        run: uv run --extra semantic python scripts/execute_notebooks.py --publish
      - name: Test user-owned inference on explicitly synthetic data
        run: uv run --extra semantic python scripts/execute_notebooks.py --synthetic
      - name: Verify the pinned real encoder
        run: uv run --extra semantic python scripts/verify_semantic.py
      - name: Render original public evidence
        run: |
          uv run --extra semantic python scripts/build_baseline_report.py
          uv run --extra semantic python scripts/build_semantic_report.py
      - name: Commit only the verified readable implementation and canonical notebooks
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          paths = ['README.md','START_HERE.md','scripts/build_notebooks.py','scripts/execute_notebooks.py','src/jigsaw_rules/cli.py','src/jigsaw_rules/features.py','src/jigsaw_rules/submission.py','tests/test_feature_experiment.py','tests/test_publication.py','tests/test_submission_generation.py','tests/test_workspace_update.py','kaggle/submission.ipynb']
          paths += [str(p) for p in sorted(Path('notebooks').glob('*.ipynb'))]
          if len(paths) != 17:
              raise SystemExit('Unexpected canonical notebook count')
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          staged = subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          if not set(staged).issubset(paths):
              raise SystemExit('Unexpected staged file')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','feat: implement notebook-owned inference and controlled feature ablations','-m','Preserve the unchanged reference run and purged split registry. Add four task-informed lexical interaction ablations, persistent model and prediction-batch checkpoints, checksum-verified user downloads, and allowlisted AWS-to-GitHub notebook publication. Execute the five canonical notebooks in real encrypted Jupyter kernels and test offline inference on synthetic data. No new competition-data feature score, neural fine-tuning, or Kaggle upload is claimed.'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/feat/notebook-owned-experiments'],check=True)
          PY
      - name: Preserve the exact verified source
        if: always()
        run: |
          mkdir -p logs
          git archive --format=zip --output=logs/source.zip HEAD
          git rev-parse HEAD > logs/source_commit.txt
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-evidence
          retention-days: 30
          if-no-files-found: error
          path: |
            logs/
            notebooks/
            kaggle/submission.ipynb
            runs/notebook_execution/
            runs/notebook_verification/kaggle_output/
            reports/baseline/comparison.svg
            reports/semantic/integration.json
            reports/semantic/comparison.svg
            runs/model_download.jsonl
