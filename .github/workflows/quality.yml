name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_LINK_MODE: copy
      JIGSAW_CLOUD: '0'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --group dev
      - run: uv run python scripts/verify.py
      - run: uv run python scripts/execute_notebooks.py --synthetic
      - name: Render the public evidence
        run: uv run python scripts/build_baseline_report.py
      - name: Retain test and notebook evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          retention-days: 30
          path: |
            logs/
            runs/notebook_verification/executed_notebooks/
            reports/baseline/comparison.svg
