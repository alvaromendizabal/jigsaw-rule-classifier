name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_LINK_MODE: copy
      JIGSAW_CLOUD: '0'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preserve the exact tracked source
        run: |
          mkdir -p logs
          git archive --format=zip --output=logs/source.zip HEAD
          git rev-parse HEAD > logs/source_commit.txt
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --extra semantic --group dev
      - run: uv run --extra semantic python scripts/verify.py
      - name: Execute the five public evidence notebooks
        run: uv run --extra semantic python scripts/execute_notebooks.py --publish
      - name: Verify checkpoint reuse
        run: uv run --extra semantic python scripts/execute_notebooks.py --publish
      - name: Test historical lexical reference on synthetic data
        run: uv run --extra semantic python scripts/execute_notebooks.py --synthetic
      - name: Verify historical reference on original competition preview data
        run: uv run --extra semantic python scripts/verify_submission.py
      - name: Verify the real pinned encoder
        run: uv run --extra semantic python scripts/verify_semantic.py
      - name: Render the public evidence
        run: |
          uv run --extra semantic python scripts/build_baseline_report.py
          uv run --extra semantic python scripts/build_semantic_report.py
      - name: Retain test and notebook evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence
          retention-days: 30
          if-no-files-found: error
          path: |
            logs/
            notebooks/
            kaggle/submission.ipynb
            kaggle/reference.ipynb
            runs/notebook_execution/
            runs/notebook_verification/kaggle_output/
            reports/baseline/comparison.svg
            reports/semantic/integration.json
            reports/semantic/comparison.svg
            reports/checkpoints/submission.json
            runs/model_download.jsonl
