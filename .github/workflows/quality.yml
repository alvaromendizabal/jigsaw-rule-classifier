name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  retained-system:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.10'
          python-version: '3.12.13'
          enable-cache: true
      - name: Install the retained locked environment
        run: uv sync --locked --group dev --extra semantic
      - name: Check every maintained source file
        run: |
          uv run --frozen --extra semantic ruff check src scripts tests
          uv run --frozen --extra semantic ruff format --check src scripts tests
      - name: Native Qwen, LoRA, exact resume and invalid-input contracts
        run: uv run --frozen --extra semantic pytest -q
      - name: Independently verify original final-result arithmetic
        run: |
          python3 -S scripts/review_portfolio.py --json
          python3 -S -O scripts/review_portfolio.py --json
      - name: Rebuild exact offline notebook source without private weights
        run: |
          uv run --frozen python scripts/build_adapted_notebook.py
          git diff --exit-code -- kaggle/submission.ipynb
      - name: Fit the authored CPU control and prove checked reuse
        run: |
          uv run --frozen jigsaw demo --root "$RUNNER_TEMP/jigsaw-cpu-demo"
          uv run --frozen jigsaw demo --root "$RUNNER_TEMP/jigsaw-cpu-demo"
          uv run --frozen jigsaw review --root "$RUNNER_TEMP/jigsaw-cpu-demo" --allow-synthetic
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synthetic-control-review
          path: ${{ runner.temp }}/jigsaw-cpu-demo/reports/private/
          if-no-files-found: error
          retention-days: 14
