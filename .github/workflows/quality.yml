name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --group dev
        env:
          UV_LINK_MODE: copy
      - run: uv run python scripts/verify.py
      - run: uv run python scripts/execute_notebooks.py --synthetic
        env:
          JIGSAW_CLOUD: '0'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
